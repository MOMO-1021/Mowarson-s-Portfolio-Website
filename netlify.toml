[build]
  command = "npm run build"
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Production context
[context.production.environment]
  PAYMENT_MODE = "live"
  NODE_ENV = "production"

# Deploy Preview context (Pull Requests)
[context.deploy-preview]
  command = "npm run build:preview"

[context.deploy-preview.environment]
  PAYMENT_MODE = "test"
  NODE_ENV = "preview"
  IS_PREVIEW = "true"
  PREVIEW_DATABASE_URL = "postgresql://neondb_owner:npg_JTEbDw3pF0Qk@ep-polished-term-a1ucne6h-pooler.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
  DATABASE_URL = "postgresql://neondb_owner:npg_JTEbDw3pF0Qk@ep-polished-term-a1ucne6h-pooler.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
  META_TEST_EVENT_CODE = "TEST71947"
  BREVO_LIST_ID = "999999"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Branch Deploy context (staging/preview branches)
[context.branch-deploy]
  command = "npm run build:preview"

[context.branch-deploy.environment]
  PAYMENT_MODE = "test"
  NODE_ENV = "staging"
  IS_PREVIEW = "true"
  PREVIEW_DATABASE_URL = "postgresql://neondb_owner:npg_JTEbDw3pF0Qk@ep-polished-term-a1ucne6h-pooler.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
  DATABASE_URL = "postgresql://neondb_owner:npg_JTEbDw3pF0Qk@ep-polished-term-a1ucne6h-pooler.ap-southeast-1.aws.neon.tech/neondb?channel_binding=require&sslmode=require"
  META_TEST_EVENT_CODE = "TEST71947"
  BREVO_LIST_ID = "999999"

[[context.branch-deploy.headers]]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
