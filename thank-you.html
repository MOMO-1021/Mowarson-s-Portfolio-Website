    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

    <script>
      (async function () {
        const token = new URLSearchParams(window.location.search).get("token");
        if (!token) return;

        try {
          const response = await fetch(
            "/api/verify-thank-you?token=" + encodeURIComponent(token),
            { credentials: "same-origin", headers: { Accept: "application/json" } }
          );
          if (!response.ok) return;
          const result = await response.json();
          if (!result.valid || !result.eventId) return;

          !(function (f, b, e, v, n, t, s) {
            if (f.fbq) return;
            n = f.fbq = function () {
              n.callMethod
                ? n.callMethod.apply(n, arguments)
                : n.queue.push(arguments);
            };
            if (!f._fbq) f._fbq = n;
            n.push = n;
            n.loaded = !0;
            n.version = "2.0";
            n.queue = [];
            t = b.createElement(e);
            t.async = !0;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          })(
            window,
            document,
            "script",
            "https://connect.facebook.net/en_US/fbevents.js"
          );
          fbq("init", result.pixelId);
          fbq("track", "PageView", {}, { eventID: result.eventId });
          fbq("track", "Contact", {}, { eventID: result.eventId });
        } catch (error) {
          console.warn("Thank-you verification unavailable.");
        }
      })();
    </script>
